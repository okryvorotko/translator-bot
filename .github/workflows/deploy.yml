name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Discard pending Telegram updates
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook" \
            --header "Content-Type: application/json" \
            --data '{"drop_pending_updates":true}'
      - name: Deploy Worker and update secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_BASE64
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_BASE64 }}
      - name: Register Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg url "$WORKER_URL" --arg secret "$WEBHOOK_SECRET" '{url: $url, secret_token: $secret, allowed_updates: ["message", "edited_message"], drop_pending_updates: true}')"
