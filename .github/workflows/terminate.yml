name: Turn Off Telegram Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  terminate-bot:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Remove Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook" \
            --header "Content-Type: application/json" \
            --data '{"drop_pending_updates":true}'
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Delete Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete telegram-translator-bot --force
